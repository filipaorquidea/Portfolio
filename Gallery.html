<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Filipa Orquídea</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <header>
        <div class="home" onclick="location.href='index.html'">Filipa Orquídea</div>
        <div class="about" onclick="location.href='about.html'">About Me</div>
        <div class="gallery-link" onclick="location.href='Gallery.html'">Gallery</div>
    </header>

    <!-- Projects Gallery -->
    <div class="container">
        <div class="gallery">
            <!-- Projetos serão carregados dinamicamente da API -->
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="closeModalOnBackground(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>

            <div class="modal-images">
                <img id="mainImage" class="main-image" src="" alt="">

                <div class="thumbnail-grid" id="thumbnailGrid"></div>
            </div>

            <div class="project-info">
                <h2 id="projectTitle"></h2>
                <div class="project-meta">
                    <span><span id="projectDate"></span></span>
                    <span><span id="projectClient"></span></span>
                </div>
                <div class="project-description" id="projectDescription"></div>
                <div class="tags" id="projectTags"></div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Filipa Orquídea. All rights reserved.
    </footer>

    <script src="trabalhos.js"></script>
</body>

</html>
